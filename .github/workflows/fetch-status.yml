name: Fetch monitor status

on:
  schedule:
    # Every 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Avoid overlapping runs racing on the commit/push.
concurrency:
  group: fetch-status
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch status from cron-job.org
        env:
          CRONJOB_API_KEY_1: ${{ secrets.CRONJOB_API_KEY_1 }}
          CRONJOB_API_KEY_2: ${{ secrets.CRONJOB_API_KEY_2 }}
        run: node fetch-status.js

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --quiet --staged; then
            echo "No status changes."
          else
            git commit -m "Update status $(date -u +%FT%TZ)"
            git push
          fi
